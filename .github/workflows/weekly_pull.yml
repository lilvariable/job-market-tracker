name: Weekly Job Postings Pull

on:
  schedule:
    # Runs every Monday at 13:00 UTC (~8am Central during CDT)
    - cron: "0 13 * * 1"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated db back

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingest script
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python src/ingest.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/job_postings.db
          git diff --cached --quiet && echo "No new data to commit" && exit 0
          git commit -m "Automated weekly job postings pull"
          git push